# 无人机统一配置：所有行为树任务共用，由 mission.launch 加载到节点私有命名空间。
# Nav 节点的速度、加速度与三轴 PID 参数。
nav:
  v_max: 5       # m/s
  a_max: 1       # m/s^2
  slow_down_time: 1.0  # 减速及速度接管曲线时长，s，须为正
  stop_velocity_tolerance: 0.01  # 各轴参考速度停止阈值，m/s
  pid_kp: 1.0
  pid_ki: 0.05
  pid_kd: 0.0

# BT 节点的 ROS 参数：时间 s，速度 m/s，高度容差 m。
connect_check:
  timeout: 60.0
capture_pose:
  timeout: 10.0
takeoff:
  ascent_speed: 0.5
  arm_timeout: 60.0  # 等待外部解锁的超时，s，须为正；Takeoff 不主动解锁
  timeout: 60.0  # 解锁后切换 OFFBOARD 与爬升的超时，s
touch_down:
  descent_speed: -0.3
  timeout: 60.0
  ground_timeout: 3.0
  height_tol: 0.3
  vel_tol: 0.2
guidance:
  tolerance: 5.0  # 视觉误差各轴容差，像素
  downward_camera: true  # 下视相机坐标转换
  kp: 0.006  # 像素误差比例增益
found_check:
  timeout: 0.5
