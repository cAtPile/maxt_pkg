# 无人机统一配置：所有行为树任务共用，由 mission.launch 加载到节点私有命名空间。
# Nav 节点的速度、加速度与三轴 PID 参数。
nav:
  azimuth_angle: 0.0  # 方位角固定航行方向，度；原始 +X 为 0，朝 +Y 为正
  v_max: 10       # m/s
  a_max: 1       # m/s^2
  hold_timeout: 3.0  # Nav/NavAzimuth/NavGeo 末端对齐强制成功超时，s
  lalo_max_duration: 60.0  # NavGeo 预计曲线时长 T 上限，s，须为有限正数；超限拒绝启动
  slow_down_time: 1.0  # 停止曲线最短时长，s；按实测速度和减速度自动延长
  stop_velocity_tolerance: 0.1  # 实测三维速度模长停止阈值，m/s
  stop_acceleration: 1.0  # 停止曲线峰值参考减速度上限，m/s²
  stop_settle_time: 0.4  # 曲线结束后，实测低速持续时间，s
  pid_kp: 1.0
  pid_ki: 0.05
  pid_kd: 0.0

# MavKit 原始局部坐标到达判定，位置单位 m，速度单位 m/s。
reach_check:
  vertical_alt_tolerance: 0.1
  vertical_vel_tolerance: 0.2
  position_pose_tolerance: 0.1
  position_vel_tolerance: 0.2
  global_position_tolerance: 0.1  # 全球水平距离容差，m
  global_altitude_tolerance: 0.5  # NavGeo 的原始 local Z 高度容差，m

# BT 节点的 ROS 参数：时间 s，速度 m/s，高度容差 m。
connect_check:
  timeout: 60.0
capture_pose:
  timeout: 10.0
takeoff:
  ascent_speed: 0.5
  timeout: 60.0  # 解锁后切换 OFFBOARD 与爬升的超时，s
touch_down:
  descent_speed: -0.3
  timeout: 60.0
  ground_timeout: 3.0
  height_tol: 0.3
  vel_tol: 0.2
guidance:
  tolerance: 10.0  # 视觉误差各轴容差，像素
  downward_camera: true  # 下视相机坐标转换
  kp: 0.006  # 像素误差比例增益
found_check:
  timeout: 0.5

# ReHeading 原地恢复到 nav/azimuth_angle；末端 PID 共用 nav/pid_*。
re_heading:
  yaw_rate_max: 0.5  # rad/s
  yaw_acc_max: 0.5  # rad/s^2
  tolerance_deg: 2.0  # 航向到达容差，度；强制成功共用 nav/hold_timeout
