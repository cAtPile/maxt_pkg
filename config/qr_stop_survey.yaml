# Local origin is the aircraft position after takeoff; n/t axes follow nav/azimuth_angle.
qr_survey:
  ordinary_ids: [QR002, QR003]
  drop_target_id: QR001
  mission_namespace: /uav_qr_mission
  length_x: 10.0
  length_y: 10.0
  step: 5.0            # include 0..5 on both axes: 6 x 6 = 36 stops
  survey_height: 2.5   # metres above takeoff; flat-field assumption
  drop_height: 3.0     # never use the QR's ellipsoid altitude as a flight altitude
  stable_seconds: 0.4
  settle_seconds: 1.0   # extra delay AFTER continuous low-speed/low-tilt stability
  max_capture_speed: 0.2
  max_capture_tilt_deg: 10.0
  hold_tolerance: 0.2
  settle_timeout: 20.0
  capture_timeout: 3.0
