# Fixed origin: aircraft XY at ascent start; fixed axes: heading at external arming.
# X positive = forward, Y positive = left. Negative Y selects the right side.
nav:
  v_max: 2          # survey speed limit, m/s
  a_max: 1          # survey acceleration limit, m/s^2
qr_survey:
  report_id: [QR002, QR003]
  target_id: QR001
  mission_namespace: /uav_qr_mission
  corner_x: 12.0      # signed opposite corner X; +forward / -backward
  corner_y: -8.0      # signed opposite corner Y; +left / -right
  step: 4.0          # spacing in metres; both edges included (here 3 x 3 = 9 stops)
  survey_height: 5   # metres above takeoff; flat-field assumption
  drop_height: 6.0     # never use the QR's ellipsoid altitude as a flight altitude
  stable_seconds: 0.4
  settle_seconds: 1.0   # extra delay AFTER continuous low-speed/low-tilt stability
  max_capture_speed: 0.2
  max_capture_tilt_deg: 10.0
  hold_tolerance: 0.2
  settle_timeout: 20.0
  capture_timeout: 3.0
