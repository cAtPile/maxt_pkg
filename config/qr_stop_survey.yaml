# Fixed origin: aircraft XY at ascent start; fixed axes: heading at external arming.
# X positive = forward, Y positive = left. Negative Y selects the right side.
nav:
  v_max: 2          # survey speed limit, m/s
  a_max: 1.25          # survey acceleration limit, m/s^2
qr_survey:
  audio_level: DEBUG # minimum BT announcement level: DEBUG, INFO, WARN, ERROR, FATAL
  report_id: [QR002, QR005]
  target_id: QR006
  mission_namespace: /uav_qr_mission
  corner_x: 15.0      # signed opposite corner X; +forward / -backward
  corner_y: -15.0      # signed opposite corner Y; +left / -right
  step: 3.0          # spacing in metres; both edges included (here 6 x 6 = 36 stops)
  survey_height: 4   # metres above takeoff; flat-field assumption
  drop_height: 6.0     # never use the QR's ellipsoid altitude as a flight altitude
  stable_seconds: 0.4 # stable_seconds 和 settle_seconds 之和作为稳定时间
  settle_seconds: 0.5   # extra delay AFTER continuous low-speed/low-tilt stability
  max_capture_speed: 0.2 
  max_capture_tilt_deg: 15.0 # 横滚、俯仰的绝对值分别检查
  hold_tolerance: 0.30
  settle_timeout: 20.0
  capture_timeout: 3.0
